<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Equipos - Chamoneta Inc</title>
    <link rel="stylesheet" href="/Paginas/main.css">
</head>
<body>

    <nav class="navbar">
        <a href="#popup-historial" class="nav-title">Historial de Reportes</a>
        <a href="#popup-usuario" class="nav-user">
            <div class="nav-avatar" id="nav-iniciales"></div>
            <div class="nav-info">
                <span class="nav-name" id="nav-nombre"></span>
                <span class="nav-role">Admin</span>
            </div>
        </a>
    </nav>

    <!--popup de historial de reportes-->
    <div class="popup-overlay" id="popup-historial">
        <a href="#" class="popup-fondo"></a>
        <div class="popup-caja">
            <a href="#" class="popup-cerrar">✕</a>
            <table class="historial-table">
                <thead>
                    <tr>
                        <th>Equipo</th>
                        <th>Fecha y Hora</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="historial-body">
                    <tr><td colspan="3">No hay reportes generados</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!--popup de usuario-->
    <div class="popup-overlay" id="popup-usuario">
        <a href="#" class="popup-fondo"></a>
        <div class="popup-caja popup-caja--usuario">
            <a href="#" class="popup-cerrar">✕</a>
            <div class="popup-user-header">
                <div class="popup-avatar" id="popup-iniciales"></div>
                <div>
                    <p class="popup-user-name" id="popup-nombre"></p>
                    <p class="popup-user-role">Admin</p>
                </div>
            </div>
            <a href="/logout" class="btn-cerrar-sesion">Cerrar Sesión</a>
        </div>
    </div>

    <!--computadoras-->
    <main class="grid-container" id="gridEquipos"></main>

    <!--Script para poner los datos del usuario en la pagina-->
    <script>
        async function cargarUsuario() {
            const respuesta = await fetch('/sesion')
            const datos = await respuesta.json()

            if (datos.usuario) {
                document.getElementById('nav-nombre').textContent = datos.usuario
                document.getElementById('popup-nombre').textContent = datos.usuario

                const iniciales = datos.usuario
                    .split(' ')
                    .map(palabra => palabra[0])
                    .join('')
                    .substring(0, 2)
                    .toUpperCase()

                document.getElementById('nav-iniciales').textContent = iniciales
                document.getElementById('popup-iniciales').textContent = iniciales
            }
        }
        cargarUsuario()
    </script>

    <!--Script principal, Muestra los equipos guardados en la base de datos-->
    <script>
        fetch('/PaginaAdmin/TablaEquipos')
        .then(res => res.json())
        .then(data => {
            const grid = document.getElementById("gridEquipos")
            grid.innerHTML = ""

            data.forEach(equipo => {
                const card = `
                <a href="/PagComputadora?id=${equipo.id_equipos}" class="equipo-card">
                    <div class="equipo-img">
                        <!-- aquí tu SVG -->
                    </div>
                    <div class="equipo-info">
                        <h3>${equipo.nombre_equipo}</h3>
                        <p>${equipo.marca}</p>
                        <p>${equipo.modelo_equipo}</p>
                        <p>${new Date(equipo.fecha_adquisicion).toLocaleDateString()}</p>
                        <span class="badge ${equipo.estado}">${equipo.estado}</span>
                    </div>
                </a>
                `
                grid.innerHTML += card
            })
        })
    </script>

    <!--Script historial de reportes-->
    <script>
        function cargarHistorial() {
            const historial = JSON.parse(localStorage.getItem('historialReportes') || '[]')
            const tbody = document.getElementById('historial-body')

            if (historial.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3">No hay reportes generados</td></tr>'
                return
            }

            tbody.innerHTML = ''
            historial.forEach(r => {
                tbody.innerHTML += `
                    <tr>
                        <td>${r.equipo}</td>
                        <td>${r.fecha} ${r.hora}</td>
                        <td>
                            <button onclick="reDescargar('${r.nombreArchivo}', \`${r.contenido.replace(/`/g, '\\`')}\`)"
                                style="background:#2563eb;color:white;border:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px">
                                ⬇ Descargar
                            </button>
                        </td>
                    </tr>
                `
            })
        }

        function reDescargar(nombreArchivo, contenido) {
            const blob = new Blob([contenido], { type: 'text/plain' })
            const url = URL.createObjectURL(blob)
            const a = document.createElement('a')
            a.href = url
            a.download = nombreArchivo
            a.click()
            URL.revokeObjectURL(url)
        }

        document.querySelector('a[href="#popup-historial"]').addEventListener('click', cargarHistorial)
    </script>

</body>
</html>
